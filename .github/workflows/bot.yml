name: V5 Ultimate Bot Runner
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy requests
      - run: python fix.py
      - run: python v5_ultimate_bot.py
